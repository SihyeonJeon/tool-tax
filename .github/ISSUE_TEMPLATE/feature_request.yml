name: Feature request
description: Propose a narrowly scoped improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What token-tax or tool-catalog workflow does this improve?
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Proposed shape
      description: CLI command, report field, extractor behavior, or fixture type.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: Link to a public catalog, benchmark, or small fixture if available.
    validations:
      required: false
