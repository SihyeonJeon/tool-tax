name: tool-tax

on:
  pull_request:
  push:

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - uses: SihyeonJeon/tool-tax@v0.2.0
        with:
          path: .
          max-tokens: "12000"
          max-tool-tokens: "750"
