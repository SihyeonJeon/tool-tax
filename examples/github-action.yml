name: tool-tax

on:
  pull_request:
  push:

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install git+https://github.com/SihyeonJeon/tool-tax.git@main
      - run: tool-tax scan . --max-tokens 12000 --max-tool-tokens 750
